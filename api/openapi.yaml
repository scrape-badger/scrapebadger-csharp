  /v1/gemini/ask:
    get:
      description: Send a prompt to Gemini and get the answer plus the web sources
        it cited.
      operationId: gemini_ask_gemini_a_question
      parameters:
      - description: The prompt to send to Gemini (max 4096 characters).
        explode: true
        in: query
        name: prompt
        required: true
        schema:
          description: The prompt to send to Gemini (max 4096 characters).
          title: Prompt
          type: string
        style: form
      - description: "ISO-3166 alpha-2 egress country, e.g. 'US', 'GB', 'DE'."
        explode: true
        in: query
        name: country
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: auto (let Gemini decide) | force (ask it to browse) | off (answer
          from memory). `web_search_triggered` in the response always reports what
          actually happened.
        explode: true
        in: query
        name: web_search
        required: false
        schema:
          default: auto
          description: auto (let Gemini decide) | force (ask it to browse) | off (answer
            from memory). `web_search_triggered` in the response always reports what
            actually happened.
          title: Web Search
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Ask Gemini a question
      tags:
      - Gemini
    post:
      description: "POST form of `/ask`, for prompts too long for a query string."
      operationId: gemini_ask_gemini_a_question_post
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - ApiKeyAuth: []
      summary: Ask Gemini a question (POST)
      tags:
      - Gemini

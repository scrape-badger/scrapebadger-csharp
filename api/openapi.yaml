  /v1/vinted/search:
    get:
      description: Search Vinted catalog items with filters.
      operationId: vinted_search_vinted_items
      parameters:
      - description: Search text
        explode: true
        in: query
        name: query
        required: true
        schema:
          description: Search text
          title: Query
          type: string
        style: form
      - description: Market code
        explode: true
        in: query
        name: market
        required: false
        schema:
          default: fr
          description: Market code
          title: Market
          type: string
        style: form
      - description: "Filter to items whose seller is physically located in one of\
          \ these comma-separated ISO-2 country codes (e.g. 'fr' or 'fr,be'). Market\
          \ domains federate cross-border EU listings and Vinted has no native country\
          \ filter, so each item is enriched with its seller's country and non-matching\
          \ ones are dropped. Adds 1 credit per uncached seller looked up (cached\
          \ for 7 days)."
        explode: true
        in: query
        name: seller_country
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 96
          minimum: 1
          title: Per Page
          type: integer
        style: form
      - explode: true
        in: query
        name: price_from
        required: false
        schema:
          nullable: true
          type: number
        style: form
      - explode: true
        in: query
        name: price_to
        required: false
        schema:
          nullable: true
          type: number
        style: form
      - explode: true
        in: query
        name: brand_ids
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "Comma-separated Vinted catalog (category) IDs to restrict the\
          \ search to, e.g. '1904' or '1904,79'. Vinted applies this before searching,\
          \ so pagination totals reflect the filtered set. A catalog ID is the `catalog[]`\
          \ value in a Vinted category URL (vinted.fr/catalog?catalog[]=1904)."
        explode: true
        in: query
        name: catalog_ids
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Comma-separated color IDs
        explode: true
        in: query
        name: color_ids
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Comma-separated condition/status IDs
        explode: true
        in: query
        name: status_ids
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: order
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Search Vinted items
      tags:
      - Vinted

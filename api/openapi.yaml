openapi: 3.1.0
info:
  description: Unified credit-based scraping API. https://docs.scrapebadger.com
  title: ScrapeBadger API
  version: 0.1.0
servers:
- url: https://scrapebadger.com
security:
- ApiKeyAuth: []
tags:
- name: Account
- name: Airbnb
- name: Amazon
- name: Apartments
- name: App-Store
- name: Baidu
- name: Bing
- name: Booking
- name: ChatGPT
- name: Depop
- name: DuckDuckGo
- name: eBay
- name: Facebook
- name: Gemini
- name: Google-Play
- name: Google
- name: Idealista
- name: Immobiliare
- name: Instagram
- name: Leboncoin
- name: LinkedIn
- name: LoopNet
- name: Perplexity
- name: Realtor
- name: Reddit
- name: Redfin
- name: TikTok
- name: Twitter
- name: Vinted
- name: Walmart
- name: Web
- name: Yahoo
- name: Yandex
- name: YouTube
- name: Zillow
paths:
  /v1/account/me:
    get:
      description: |-
        Get account details for the authenticated API key.

        Returns credit balances, tier, rate limit, and subscription details.
        No credits are deducted for this call.
      operationId: account_get_account_info
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
          description: Successful Response
      security:
      - ApiKeyAuth: []
      summary: Get account info
      tags:
      - Account
  /v1/airbnb/experiences:
    get:
      description: Search Airbnb Experiences by location.
      operationId: airbnb_search_experiences
      parameters:
      - description: "Free-text place, e.g. 'Rome, Italy'"
        explode: true
        in: query
        name: location
        required: true
        schema:
          description: "Free-text place, e.g. 'Rome, Italy'"
          title: Location
          type: string
        style: form
      - description: next_page_cursor from a prior response
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: currency
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: locale
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Search experiences
      tags:
      - Airbnb
  /v1/airbnb/experiences/{experience_id}:
    get:
      description: |-
        Full detail for one experience: description, rating, host, location and
        photos.
      operationId: airbnb_get_experience_detail
      parameters:
      - explode: false
        in: path
        name: experience_id
        required: true
        schema:
          title: Experience Id
          type: string
        style: simple
      - explode: true
        in: query
        name: adults
        required: false
        schema:
          default: 1
          minimum: 1
          title: Adults
          type: integer
        style: form
      - explode: true
        in: query
        name: children
        required: false
        schema:
          default: 0
          minimum: 0
          title: Children
          type: integer
        style: form
      - explode: true
        in: query
        name: infants
        required: false
        schema:
          default: 0
          minimum: 0
          title: Infants
          type: integer
        style: form
      - explode: true
        in: query
        name: currency
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: locale
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Get experience detail
      tags:
      - Airbnb
  /v1/airbnb/health:
    get:
      description: Check health of the Airbnb scraper service (accepts HEAD).
      operationId: airbnb_airbnb_scraper_health_check
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - ApiKeyAuth: []
      summary: Airbnb scraper health check
      tags:
      - Airbnb
    head:
      description: Check health of the Airbnb scraper service (accepts HEAD).
      operationId: airbnb_airbnb_scraper_health_check_head
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - ApiKeyAuth: []
      summary: Airbnb scraper health check
      tags:
      - Airbnb
  /v1/airbnb/listings/{room_id}:
    get:
      description: |-
        Full detail for one listing: amenities, house rules, host, ratings,
        coordinates and photos.
      operationId: airbnb_get_listing_detail
      parameters:
      - explode: false
        in: path
        name: room_id
        required: true
        schema:
          title: Room Id
          type: string
        style: simple
      - explode: true
        in: query
        name: adults
        required: false
        schema:
          default: 1
          minimum: 1
          title: Adults
          type: integer
        style: form
      - explode: true
        in: query
        name: currency
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: locale
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Get listing detail
      tags:
      - Airbnb
  /v1/airbnb/listings/{room_id}/calendar:
    get:
      description: |-
        Day-by-day availability for up to 12 months: bookable, check-in/out
        windows and min/max nights per date.
      operationId: airbnb_get_availability_calendar
      parameters:
      - explode: false
        in: path
        name: room_id
        required: true
        schema:
          title: Room Id
          type: string
        style: simple
      - description: Start month (1-12)
        explode: true
        in: query
        name: month
        required: false
        schema:
          default: 1
          description: Start month (1-12)
          maximum: 12
          minimum: 1
          title: Month
          type: integer
        style: form
      - description: Start year
        explode: true
        in: query
        name: year
        required: false
        schema:
          default: 2026
          description: Start year
          maximum: 2100
          minimum: 2020
          title: Year
          type: integer
        style: form
      - description: Number of months (max 12)
        explode: true
        in: query
        name: months
        required: false
        schema:
          default: 12
          description: Number of months (max 12)
          maximum: 12
          minimum: 1
          title: Months
          type: integer
        style: form
      - explode: true
        in: query
        name: currency
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: locale
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Get availability calendar
      tags:
      - Airbnb
  /v1/airbnb/listings/{room_id}/reviews:
    get:
      description: |-
        Paginated guest reviews with reviewer, rating, date, text and host
        response.
      operationId: airbnb_get_listing_reviews
      parameters:
      - explode: false
        in: path
        name: room_id
        required: true
        schema:
          title: Room Id
          type: string
        style: simple
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 24
          maximum: 50
          minimum: 1
          title: Limit
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
        style: form
      - description: MOST_RECENT | RATING_DESC | RATING_ASC
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: MOST_RECENT
          description: MOST_RECENT | RATING_DESC | RATING_ASC
          title: Sort
          type: string
        style: form
      - explode: true
        in: query
        name: currency
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: locale
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Get listing reviews
      tags:
      - Airbnb
  /v1/airbnb/search:
    get:
      description: |-
        Search Airbnb stays by place name and/or map bounding box, with dates,
        guests, price and property filters. Paginate with the `cursor`.
      operationId: airbnb_search_stays
      parameters:
      - description: "Free-text place, e.g. 'Paris, France'"
        explode: true
        in: query
        name: location
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Map bounding-box NE latitude
        explode: true
        in: query
        name: ne_lat
        required: false
        schema:
          nullable: true
          type: number
        style: form
      - description: Map bounding-box NE longitude
        explode: true
        in: query
        name: ne_lng
        required: false
        schema:
          nullable: true
          type: number
        style: form
      - description: Map bounding-box SW latitude
        explode: true
        in: query
        name: sw_lat
        required: false
        schema:
          nullable: true
          type: number
        style: form
      - description: Map bounding-box SW longitude
        explode: true
        in: query
        name: sw_lng
        required: false
        schema:
          nullable: true
          type: number
        style: form
      - description: Check-in date YYYY-MM-DD
        explode: true
        in: query
        name: check_in
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: Check-out date YYYY-MM-DD
        explode: true
        in: query
        name: check_out
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: adults
        required: false
        schema:
          default: 1
          minimum: 0
          title: Adults
          type: integer
        style: form
      - explode: true
        in: query
        name: children
        required: false
        schema:
          default: 0
          minimum: 0
          title: Children
          type: integer
        style: form
      - explode: true
        in: query
        name: infants
        required: false
        schema:
          default: 0
          minimum: 0
          title: Infants
          type: integer
        style: form
      - explode: true
        in: query
        name: pets
        required: false
        schema:
          default: 0
          minimum: 0
          title: Pets
          type: integer
        style: form
      - explode: true
        in: query
        name: price_min
        required: false
        schema:
          minimum: 0
          nullable: true
          type: integer
        style: form
      - explode: true
        in: query
        name: price_max
        required: false
        schema:
          minimum: 0
          nullable: true
          type: integer
        style: form
      - explode: true
        in: query
        name: min_bedrooms
        required: false
        schema:
          minimum: 0
          nullable: true
          type: integer
        style: form
      - explode: true
        in: query
        name: min_beds
        required: false
        schema:
          minimum: 0
          nullable: true
          type: integer
        style: form
      - explode: true
        in: query
        name: min_bathrooms
        required: false
        schema:
          minimum: 0
          nullable: true
          type: integer
        style: form
      - description: "e.g. 'Entire home/apt', 'Private room'"
        explode: true
        in: query
        name: room_type
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: next_page_cursor from a prior response
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 18
          maximum: 50
          minimum: 1
          title: Limit
          type: integer
        style: form
      - description: "ISO currency, e.g. USD, EUR"
        explode: true
        in: query
        name: currency
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "Locale, e.g. en, fr"
        explode: true
        in: query
        name: locale
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Search stays
      tags:
      - Airbnb
  /v1/amazon/autocomplete:
    get:
      description: Get Amazon search autocomplete suggestions for keyword research.
      operationId: amazon_keyword_suggestions
      parameters:
      - description: Partial search term
        explode: true
        in: query
        name: query
        required: true
        schema:
          description: Partial search term
          title: Query
          type: string
        style: form
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          default: com
          title: Domain
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Keyword suggestions
      tags:
      - Amazon
  /v1/amazon/bestsellers:
    get:
      description: Top-selling products for a category (browse node).
      operationId: amazon_bestsellers_by_category
      parameters:
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          default: com
          title: Domain
          type: string
        style: form
      - description: Bestsellers node id or slug
        explode: true
        in: query
        name: category
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          maximum: 2
          minimum: 1
          title: Page
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Bestsellers by category
      tags:
      - Amazon
  /v1/amazon/categories:
    get:
      description: List common Amazon department/category aliases and bestseller nodes.
      operationId: amazon_list_category_aliases
      parameters:
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          default: com
          title: Domain
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: List category aliases
      tags:
      - Amazon
  /v1/amazon/category:
    get:
      description: List products within an Amazon browse-node category.
      operationId: amazon_browse_node_category_listing
      parameters:
      - description: Amazon browse-node id
        explode: true
        in: query
        name: node
        required: true
        schema:
          description: Amazon browse-node id
          title: Node
          type: string
        style: form
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          default: com
          title: Domain
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          maximum: 20
          minimum: 1
          title: Page
          type: integer
        style: form
      - explode: true
        in: query
        name: sort_by
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Browse-node category listing
      tags:
      - Amazon
  /v1/amazon/deals:
    get:
      description: "Current Amazon deals (lightning deals, best deals)."
      operationId: amazon_today_s_deals
      parameters:
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          default: com
          title: Domain
          type: string
        style: form
      - explode: true
        in: query
        name: category
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Today's deals
      tags:
      - Amazon
  /v1/amazon/health:
    get:
      description: Check health of the Amazon scraper service (accepts HEAD for UptimeRobot).
      operationId: amazon_amazon_scraper_health_check
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - ApiKeyAuth: []
      summary: Amazon scraper health check
      tags:
      - Amazon
    head:
      description: Check health of the Amazon scraper service (accepts HEAD for UptimeRobot).
      operationId: amazon_amazon_scraper_health_check_head
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - ApiKeyAuth: []
      summary: Amazon scraper health check
      tags:
      - Amazon
  /v1/amazon/markets:
    get:
      description: List all supported Amazon marketplaces.
      operationId: amazon_list_marketplaces
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - ApiKeyAuth: []
      summary: List marketplaces
      tags:
      - Amazon
  /v1/amazon/new-releases:
    get:
      description: Newly released products for a category (browse node).
      operationId: amazon_new_releases_by_category
      parameters:
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          default: com
          title: Domain
          type: string
        style: form
      - explode: true
        in: query
        name: category
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          maximum: 2
          minimum: 1
          title: Page
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: New releases by category
      tags:
      - Amazon
  /v1/amazon/products/{asin}:
    get:
      description: "Full product detail by ASIN (price, variants, badges, buybox,\
        \ ranks…)."
      operationId: amazon_get_product_detail
      parameters:
      - explode: false
        in: path
        name: asin
        required: true
        schema:
          title: Asin
          type: string
        style: simple
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          default: com
          title: Domain
          type: string
        style: form
      - description: Delivery postal/zip for localized buybox
        explode: true
        in: query
        name: zip
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: language
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Get product detail
      tags:
      - Amazon
  /v1/amazon/products/{asin}/offers:
    get:
      description: "All third-party offers for an ASIN, including the Buy Box winner."
      operationId: amazon_get_all_seller_offers_buybox
      parameters:
      - explode: false
        in: path
        name: asin
        required: true
        schema:
          title: Asin
          type: string
        style: simple
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          default: com
          title: Domain
          type: string
        style: form
      - explode: true
        in: query
        name: zip
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - description: "Offer page, 10 rows each"
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          description: "Offer page, 10 rows each"
          minimum: 1
          title: Page
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Get all seller offers (buybox)
      tags:
      - Amazon
  /v1/amazon/products/{asin}/reviews:
    get:
      description: "Customer reviews for an ASIN (featured + paginated, with filters)."
      operationId: amazon_get_product_reviews
      parameters:
      - explode: false
        in: path
        name: asin
        required: true
        schema:
          title: Asin
          type: string
        style: simple
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          default: com
          title: Domain
          type: string
        style: form
